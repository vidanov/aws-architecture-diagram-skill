name: Validate Plugin
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - name: Validate marketplace.json
        run: |
          echo "Checking marketplace.json syntax..."
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"
          echo "✅ marketplace.json is valid JSON"
      - name: Validate plugin.json
        run: |
          echo "Checking plugin.json syntax..."
          python3 -c "import json; json.load(open('plugins/aws-architecture-diagram/.claude-plugin/plugin.json'))"
          echo "✅ plugin.json is valid JSON"
      - name: Check SKILL.md frontmatter
        run: |
          echo "Checking SKILL.md files have frontmatter..."
          for f in kiro/SKILL.md claude/SKILL.md plugins/aws-architecture-diagram/skills/aws-architecture-diagram/SKILL.md; do
            if head -1 "$f" | grep -q "^---"; then
              echo "✅ $f has frontmatter"
            else
              echo "❌ $f missing frontmatter"
              exit 1
            fi
          done
      - name: Check no XML comments in templates
        run: |
          echo "Checking templates for XML comments..."
          if grep -r "<!--" templates/; then
            echo "❌ Found XML comments in templates"
            exit 1
          else
            echo "✅ No XML comments in templates"
          fi
